[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-quality-template"
version = "1.0.0"
description = "A reference project layout: CI/CD, tests, docs, benchmarks, quality metrics and reproducible releases."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Igors Volohovs", email = "igorsvolohovs@gmail.com" }]
keywords = ["template", "ci", "quality", "iso25010"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "radon>=6.0",
    "pre-commit>=3.7",
]
release = ["pyinstaller>=6.0"]

[project.scripts]
quality-template = "quality_template.cli:main"

[project.urls]
Homepage = "https://github.com/IGORSVOLOHOVS/repo-quality-template"
Issues = "https://github.com/IGORSVOLOHOVS/repo-quality-template/issues"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------- formatting
# Point 9 of the standard: style is enforced by a tool, never by hand.
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts", "benchmarks"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import order
    "UP",        # pyupgrade
    "B",         # bugbear
    "SIM",       # simplify
    "C90",       # mccabe complexity
    "S",         # bandit security rules
    "RUF",
]
ignore = ["S101"]  # assert is how pytest works

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
# target-version is py310, where tomllib does not exist, so ruff sorts it as a
# third-party package. The scripts that read pyproject.toml run on 3.12, where
# it is standard library, and grouping it with argparse is what a reader
# expects.
extra-standard-library = ["tomllib"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "C90"]
"benchmarks/*" = ["S"]
"scripts/*" = ["S404", "S603", "S607"]  # these scripts drive git/pyinstaller on purpose

[tool.ruff.format]
quote-style = "double"

# ------------------------------------------------------- contribution shape
# Written once. scripts/enforce_contribution_policy.py, the issue templates and
# the pull-request template all describe the same vocabulary, so this is the
# only place it is defined. See docs/workflow.md.
[tool.repo-quality]
code = "rqt"
long_lived_branches = ["release", "dev", "test"]
branch_types = [
    "feat", "fix", "docs", "test", "refactor",
    "perf", "build", "ci", "chore", "security",
]
commit_types = [
    "feat", "fix", "docs", "test", "refactor",
    "perf", "build", "ci", "chore", "security",
]
commit_scopes = ["core", "cli", "app", "ci", "docs", "scripts", "benchmarks", "release"]

# --------------------------------------------------------------- type checks
# Scoped to src/ on purpose: that is the product. The scripts in scripts/ drive
# git and pyinstaller and are checked by ruff, not by mypy.
[tool.mypy]
files = ["src"]
python_version = "3.10"
strict = true
warn_unreachable = true

# --------------------------------------------------------------------- tests
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = ["slow: takes more than a second"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Point 3: coverage is not decorative - the build fails below this line.
fail_under = 85
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
